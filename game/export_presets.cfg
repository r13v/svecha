[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/icons/sources.json,assets/lighting/lightmap_meshes.json,assets/CREDITS_RU.txt,assets/GODOT_LICENSES.txt"
exclude_filter="tests/*,scenes/asset_review.tscn,scripts/asset_review.gd,scenes/nave_bake.tscn,addons/nave_baker/*"
export_path="../builds/macos/Svecha.app"
script_export_mode=2

[preset.0.options]

export_method=1
binary_format/architecture="universal"
application/name="Свеча"
application/bundle_identifier="org.svecha.prototype"
application/signature="SVCH"
application/short_version="0.2.1"
application/version="0.2.1"
codesign/codesign=1
notarization/notarization=0

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/icons/sources.json,assets/lighting/lightmap_meshes.json,assets/CREDITS_RU.txt,assets/GODOT_LICENSES.txt"
exclude_filter="tests/*,scenes/asset_review.tscn,scripts/asset_review.gd,scenes/nave_bake.tscn,addons/nave_baker/*"
export_path="../builds/web/index.html"
script_export_mode=2

[preset.1.options]

variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/loading.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
