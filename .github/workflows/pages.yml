name: Опубликовать игру

on:
  push:
    branches: [main]
    paths: ["game/**", "tools/godot", "tools/export_web.sh", "tools/prepare_web.py", "tools/compact_web.py", "tools/test_web_export.py", "tools/check_web.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Установить Godot 4.7.2 и шаблоны Web
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/web*.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Собрать Web
        run: |
          python3 tools/test_web_export.py
          ./tools/export_web.sh
      - name: Проверить игровой маршрут
        run: ./tools/godot --headless --path .tools/web-project --main-pack "$PWD/builds/web/index.pck" --script "$PWD/game/tests/check_game.gd"
      - name: Установить браузер для проверки
        run: |
          npm install --global agent-browser@0.37.1
          agent-browser install --with-deps
      - name: Проверить загрузку WebGL и журнал браузера
        run: xvfb-run -a ./tools/check_web.sh --load-only
      - name: Сохранить кадры и журналы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-check
          path: .tools/checks
      - uses: actions/upload-pages-artifact@v4
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
